[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "opencv-python>=4.10",
    "ultralytics>=8.3",
    "numpy>=1.26",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shelf", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
